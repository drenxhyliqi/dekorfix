# Local development stack: PostgreSQL → FastAPI → Next.js.
# Usage: cp .env.example .env && docker compose up --build

name: dekorfix

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: development
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Inside the network the API reaches Postgres by service name. The URL is
      # built from these parts, so DATABASE_URL is cleared to take no effect here.
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-3000}}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      # Uploaded product images, kept across rebuilds (served by the API at /media).
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      # Browser → API (published host port).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
      # Next.js server → API (container network).
      API_INTERNAL_URL: http://api:8000
      SITE_URL: ${SITE_URL:-http://localhost:${WEB_PORT:-3000}}
      # Website assistant (server only, never sent to the browser).
      OPEN_AI_KEY: ${OPEN_AI_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
      # Keep the container's own build cache and dependencies.
      - /app/apps/web/.next
      - /app/apps/web/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  media:
